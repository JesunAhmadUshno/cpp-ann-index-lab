name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (gcc, C++20, warnings on)
        run: cmake --build build -j4
      - name: Unit tests
        run: ./build/ann_tests
      - name: Smoke benchmark (small synthetic slice)
        run: ./build/ann_bench --synthetic --out results/smoke.json
      - name: CLI smoke (demo data, graph and IVF queries)
        run: |
          python3 tools/make_demo_data.py --out-dir build/demo
          ./build/ann_query --corpus build/demo/corpus.f32 \
              --queries build/demo/queries.f32 --n 2000 --d 64 --nq 8 \
              --index graph --m 16 --ef 64
          ./build/ann_query --corpus build/demo/corpus.f32 \
              --queries build/demo/queries.f32 --n 2000 --d 64 --nq 8 \
              --index ivf --nlist 32 --nprobe 8
