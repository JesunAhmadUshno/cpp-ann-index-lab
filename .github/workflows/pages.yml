name: Pages

# Builds the dashboard in site/ and publishes it to GitHub Pages. The site's
# numbers are generated during the build from the study record
# (results/run_full.json, RESULTS.md, PREREGISTRATION.md, SPEC.md) by
# site/src/gen_data.mjs; the build fails if the record does not parse.
on:
  push:
    branches: [main]
    paths: ['site/**', 'results/run_full.json', 'RESULTS.md', 'PREREGISTRATION.md', 'SPEC.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
